name: Studio macOS

on:
  pull_request:
    paths:
      - "vendoo-studio/**"
      - "vendoo-extension/**"
      - "skills/list-this/**"
      - ".github/workflows/studio-macos.yml"
  push:
    branches: [main]
    paths:
      - "vendoo-studio/**"
      - "vendoo-extension/**"
      - "skills/list-this/**"
      - ".github/workflows/studio-macos.yml"
  workflow_dispatch:

concurrency:
  group: studio-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Studio backend tests
        working-directory: vendoo-studio
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e .
          .venv/bin/python -m unittest discover -s server/tests -q

  package:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - name: Package app
        working-directory: vendoo-studio
        env:
          PYTHON: ${{ github.workspace }}/vendoo-studio/.venv/bin/python
        run: |
          python -m venv .venv
          "$PYTHON" -m pip install -U pip
          "$PYTHON" -m pip install -e ".[package]"
          ./scripts/package-macos-app.sh
      - name: Publish GitHub release
        working-directory: vendoo-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-macos-release.sh
