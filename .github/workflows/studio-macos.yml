name: Studio macOS

on:
  push:
    branches: [main]
    paths:
      - "vendoo-studio/**"
      - "vendoo-extension/**"
      - "skills/list-this/**"
      - ".github/workflows/studio-macos.yml"
  workflow_dispatch:

concurrency:
  group: studio-macos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
        run: |
          if [[ -z "$CERT_P12_BASE64" ]]; then
            echo "No signing certificate secret; the app will be ad-hoc signed."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/signing.p12"
          security find-identity -p codesigning "$KEYCHAIN"
          echo "MACOS_SIGNING_IDENTITY=List This Studio Signing" >> "$GITHUB_ENV"
      - name: Package app
        working-directory: vendoo-studio
        env:
          PYTHON: ${{ github.workspace }}/vendoo-studio/.venv/bin/python
        run: |
          python -m venv .venv
          "$PYTHON" -m pip install -U pip
          "$PYTHON" -m pip install -e ".[package]"
          ./scripts/package-macos-app.sh
      - name: Verify update zip has no symlinks
        working-directory: vendoo-studio
        env:
          PYTHON: ${{ github.workspace }}/vendoo-studio/.venv/bin/python
        run: |
          "$PYTHON" - release/List-This-Studio-macos.zip <<'PY'
          import sys
          from pathlib import Path
          from vendoo_studio.services.bundle_symlinks import assert_zip_has_no_symlinks
          assert_zip_has_no_symlinks(Path(sys.argv[1]))
          print("OK: release zip has no symbolic link members")
          PY
      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main'
        working-directory: vendoo-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-macos-release.sh
