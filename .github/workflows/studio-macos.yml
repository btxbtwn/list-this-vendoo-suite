name: Studio macOS

on:
  push:
    branches: [main]
    paths:
      - "vendoo-studio/**"
      - "vendoo-extension/**"
      - "skills/list-this/**"
      - ".github/workflows/studio-macos.yml"
  workflow_dispatch:

concurrency:
  group: studio-macos
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - name: Package app
        working-directory: vendoo-studio
        env:
          PYTHON: ${{ github.workspace }}/vendoo-studio/.venv/bin/python
        run: |
          python -m venv .venv
          "$PYTHON" -m pip install -U pip
          "$PYTHON" -m pip install -e ".[package]"
          ./scripts/package-macos-app.sh
      - name: Publish GitHub release
        working-directory: vendoo-studio
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-macos-release.sh
