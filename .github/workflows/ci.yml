name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block tracked secret files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.pem$|(^|/)credentials\.json$|(^|/)id_rsa$'; then
            echo "Secret-like files must not be tracked." >&2
            exit 1
          fi
      - name: Scan working tree
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-git --redact --verbose

  studio-frontend:
    name: Studio frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vendoo-studio/package-lock.json
      - run: npm ci
      - run: npm run build

  studio-backend:
    name: Studio backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendoo-studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          VENDOO_STUDIO_DATA_DIR: ${{ runner.temp }}/vendoo-studio-data

  extension:
    name: Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate manifest and sample listing
        run: |
          python -m json.tool vendoo-extension/manifest.json >/dev/null
          python -m json.tool vendoo-extension/sample-listing.json >/dev/null
      - name: Syntax-check JavaScript
        run: |
          git ls-files 'vendoo-extension/*.js' 'vendoo-extension/content-scripts/*.js' \
            | while IFS= read -r file; do
                node --check "$file"
              done

  skills:
    name: Skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate skill sources
        run: |
          test -f skills/list-this/SKILL.md
          python -m json.tool skills/list-this/references/vendoo-dropdown-options.json >/dev/null

  ci:
    name: CI
    if: always()
    needs:
      - secrets
      - studio-frontend
      - studio-backend
      - extension
      - skills
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "Job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
