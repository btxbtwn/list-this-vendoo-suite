name: iPhone app

on:
  pull_request:
    paths:
      - "anteroom-ios/**"
      - ".github/workflows/ios.yml"
      - "vendoo-studio/server/**"
      - "vendoo-studio/pyproject.toml"
  push:
    branches: [main]
    paths:
      - "anteroom-ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build for Simulator
    runs-on: macos-26
    defaults:
      run:
        working-directory: anteroom-ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Test stream framing
        run: |
          xcrun swiftc Sources/API/StreamFrame.swift Tests/StreamFramesTests.swift -o "$RUNNER_TEMP/stream-tests"
          "$RUNNER_TEMP/stream-tests"
      - name: Test history contracts
        run: |
          xcrun swiftc Sources/API/HistoryModels.swift Tests/HistoryModelsTests.swift -o "$RUNNER_TEMP/history-tests"
          "$RUNNER_TEMP/history-tests"
      - name: Test seller input preservation
        run: |
          xcrun swiftc Sources/Inputs/SellerInputs.swift Tests/SellerInputsTests.swift -o "$RUNNER_TEMP/seller-input-tests"
          "$RUNNER_TEMP/seller-input-tests"
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project Anteroom.xcodeproj \
            -scheme Anteroom \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  sandbox-tests:
    name: iPhone sandbox tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Prepare disposable hosted API and simulator project
        run: |
          brew install xcodegen
          cd vendoo-studio
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Create and reopen a draft through the hosted sandbox
        run: |
          set -o pipefail
          xcodebuild -downloadPlatform iOS
          SIMULATOR_ID="$(xcrun simctl create 'Anteroom sandbox tests' 'com.apple.CoreSimulator.SimDeviceType.iPhone-17')"
          ANTEROOM_TEST_DESTINATION="platform=iOS Simulator,id=$SIMULATOR_ID" \
            ANTEROOM_TEST_RESULTS="$RUNNER_TEMP/sandbox.xcresult" ./anteroom-ios/test-sandbox.sh
      - name: Export simulator screenshots
        if: always()
        run: |
          if [[ -d "$RUNNER_TEMP/sandbox.xcresult" ]]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/sandbox.xcresult" --output-path "$RUNNER_TEMP/screenshots"
          fi
      - name: Keep simulator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphone-sandbox-results
          path: |
            ${{ runner.temp }}/sandbox.xcresult
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/sandbox.log

  testflight:
    name: Upload to TestFlight
    # Pull requests (including forks) never reach the signing key.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: macos-26
    defaults:
      run:
        working-directory: anteroom-ios
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      # Archive unsigned: development signing would need a registered device.
      # The export below signs for App Store distribution with the API key.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Anteroom.xcodeproj \
            -scheme Anteroom \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Anteroom.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Upload
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Anteroom.xcarchive" \
            -exportOptionsPlist Config/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8"
