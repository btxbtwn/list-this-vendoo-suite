<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark" />
    <title>Vendoo Listing Studio</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem("vendoo-studio:theme");
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "dark";
          var light =
            pref === "light" ||
            (pref === "system" && window.matchMedia("(prefers-color-scheme: light)").matches);
          var theme = light ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var color = light ? "#f4f4f5" : "#0a0a0a";
          var themeMeta = document.querySelector('meta[name="theme-color"]');
          if (themeMeta) themeMeta.setAttribute("content", color);
          var schemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (schemeMeta) schemeMeta.setAttribute("content", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
