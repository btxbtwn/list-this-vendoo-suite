[project]
name = "vendoo-studio"
version = "0.1.18"
description = "Local web app for generating and automating Vendoo marketplace listings"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "keyring>=25.0.0",
    "aiofiles>=24.0.0",
    "semble>=0.5.0",
    "cursor-sdk>=1.0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
]
desktop = [
    "pywebview>=5,<7",
]
package = [
    "pywebview>=5,<7",
    "pyinstaller>=6.3",
]

[project.scripts]
vendoo-studio = "vendoo_studio.main:main"
vendoo-studio-category-trees = "vendoo_studio.category_trees_cli:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server", "server/tests"]

[tool.ruff]
target-version = "py312"
src = ["server"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# (str, Enum) and StrEnum format differently; keep the explicit mixins.
ignore = ["UP042"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body", "fastapi.Header"]
