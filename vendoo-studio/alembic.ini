# Studio's migrations live inside the package so they ship with the Mac app.
# At runtime vendoo_studio.services.schema_migrations builds this config
# programmatically; this file exists so the alembic CLI works in a checkout:
#
#   cd vendoo-studio && .venv/bin/alembic revision --autogenerate -m "..."
#   cd vendoo-studio && .venv/bin/alembic upgrade head
[alembic]
script_location = server/vendoo_studio/migrations
prepend_sys_path = server

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
